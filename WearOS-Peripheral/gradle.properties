org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is mandatory for every dependency used here.
android.useAndroidX=true

# Kotlin code style for the IDE formatter.
kotlin.code.style=official

# Only build the ABIs a real Galaxy Watch needs, instead of every variant.
# Wear OS 3+ watches (Galaxy Watch 4 and later) are arm64.
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
